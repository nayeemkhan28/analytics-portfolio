<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><rect width="1000" height="620" fill="#111d2c"/><g font-family="Arial" fill="#f2f7ff"><text x="40" y="50" font-size="28">Customer retention | acquisition cohorts</text><text x="40" y="85">Synthetic subscription scenario • January–June 2025 cohorts • observed through December</text><text x="40" y="145" font-size="30">600 acquired     448 active at M3     74.7% M3 retention</text><text x="40" y="210" font-size="22">M3 retention by acquisition channel</text><text x="40" y="265">Organic (n=194)</text><rect x="240" y="243" width="457.74" height="32" fill="#4ed9ba"/><text x="712.74" y="265">76.3%</text><text x="40" y="345">Paid (n=191)</text><rect x="240" y="323" width="370.68" height="32" fill="#4ed9ba"/><text x="625.6800000000001" y="345">61.8%</text><text x="40" y="425">Referral (n=215)</text><rect x="240" y="403" width="507.90000000000003" height="32" fill="#4ed9ba"/><text x="762.9000000000001" y="425">84.7%</text><text x="40" y="535">M3 = active three calendar months after acquisition; denominator = acquired cohort.</text><text x="40" y="575">Illustrative data: channel differences are built into the generator, not causal evidence.</text></g></svg>